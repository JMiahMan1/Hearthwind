plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	version = "${project.minecraft_version}+0.1.0"
	group = project.maven_group
	repositories {
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.shedaniel.me/' }
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		implementation files("${rootDir}/../dev-server/mods/architectury-fabric-21.0.7.jar")
		implementation files("${rootDir}/../dev-server/mods/cloth-config-26.2.155.jar")
		implementation files("${rootDir}/../dev-server/mods/modmenu-20.0.1.jar")
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		// letsdo-* ports surface hundreds of errors at once; raise javac's
		// default 100-error cap so baselines are complete.
		it.options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
	}

	// hearthwind-client needs survival's ThirstSyncPayload at compile and
	// runtime. Must be declared BEFORE loom resolves runtime classpath, so do
	// it here, not in afterEvaluate (which is too late for implementation).
	if (project.name == 'hearthwind-client') {
		dependencies {
			implementation project(':hearthwind-survival')
			implementation project(':hearthwind-world')
			// gametest scenarios read SkillXp/JobState attachments and
			// JobDefs level tables from the gametest thread
			implementation project(':hearthwind-skills')
			implementation project(':hearthwind-jobs')
		}
	}
	if (project.name == 'hearthwind-world') {
		tasks.named('processResources') {
			from(rootProject.file('../conversion/datapacks/hearthwind')) {
				include 'data/hearthwind/worldgen/configured_feature/coarse_dirt_ledge_pine.json'
				include 'data/hearthwind/worldgen/placed_feature/coarse_dirt_ledge_pine.json'
			}
			from(rootProject.file('../conversion/curated/datapack-overrides')) {
				include 'data/formationsoverworld/loot_table/stone_tower/smithing.json'
				include 'data/formationsoverworld/loot_table/witch_tower/smithing.json'
			}
			duplicatesStrategy = DuplicatesStrategy.FAIL
		}
	}
	if (project.name == 'hearthwind-primitive') {
		dependencies {
			implementation project(':hearthwind-survival')
			implementation project(':hearthwind-world')
		}
	}
	if (project.name == 'hearthwind-skills') {
		dependencies {
			implementation project(':hearthwind-survival')
		}
	}
	if (project.name == 'hearthwind-jobs') {
		dependencies {
			implementation project(':hearthwind-survival')
			implementation project(':hearthwind-skills')
		}
	}
	if (project.name == 'hearthwind-survival') {
		dependencies {
			implementation project(':hearthwind-world')
		}
	}
	if (project.name.startsWith('letsdo-') && project.name != 'letsdo-farm-and-charm') {
		dependencies {
			implementation project(':letsdo-farm-and-charm')
			// Sobriety flag lives in survival config; letsdo ports read it
			// (guarded at runtime so standalone installs keep full content).
			implementation project(':hearthwind-survival')
		}
	}
	if (project.name == 'letsdo-nethervinery') {
		dependencies {
			implementation project(':letsdo-vinery')
		}
	}
	if (project.name == 'letsdo-farm-and-charm' || project.name == 'letsdo-bakery' || project.name == 'letsdo-vinery' || project.name == 'letsdo-brewery' || project.name == 'letsdo-candlelight' || project.name == 'letsdo-herbalbrews' || project.name == 'letsdo-meadow' || project.name == 'letsdo-nethervinery') {
		dependencies {
			implementation files("${rootDir}/../dev-server/mods/rei-26.2.820-fabric.jar")
			implementation files("${rootDir}/../dev-server/mods/cloth-basic-math-0.6.1.jar")
			implementation files("${rootDir}/../dev-server/mods/modmenu-20.0.1.jar")
		}
	}
	if (project.name.startsWith('letsdo-')) {
		// Single letsdo wiring block (kept pre-afterEvaluate so Loom
		// resolves the mod compile classpath before task graph calc).
		// Full module set lives here; do NOT duplicate in afterEvaluate.
		dependencies {
			modCompileClasspath "dev.architectury:architectury:21.0.7"
			modCompileClasspath "dev.architectury:architectury-fabric:21.0.7"
			modCompileClasspath "me.shedaniel.cloth:cloth-config-fabric:19.0.147"
			modCompileClasspath "net.fabricmc.fabric.api:fabric-object-builder-api-v1:24.1.0+6fcd5f039e"
			modCompileClasspath "net.fabricmc.fabric.api:fabric-resource-loader-v1:2.0.13+9edec1269e"
			modCompileClasspath "net.fabricmc.fabric.api:fabric-lifecycle-events-v1:4.1.3+4575b05f9e"
			modCompileClasspath "net.fabricmc.fabric.api:fabric-rendering-v1:25.3.2+515ac5339e"
			modCompileClasspath files("${rootDir}/../dev-server/mods/modmenu-20.0.1.jar")
		}
	}
	if (project.name in ['athena', 'chipped']) {
		dependencies {
			modCompileClasspath "dev.architectury:architectury:21.0.7"
			modCompileClasspath "dev.architectury:architectury-fabric:21.0.7"
			modCompileClasspath "net.fabricmc.fabric.api:fabric-gametest-api-v1:4.0.21+4a7fa0819e"
			modCompileClasspath files("${rootDir}/../dev-server/mods/ResourcefulLib-5.0.3.jar")
			modCompileClasspath files("${rootDir}/../conversion/vendored/resourcefullib-bytecodecs/bytecodecs-1.1.3.jar")
			modCompileClasspath files("${rootDir}/../conversion/vendored/resourcefullib-bytecodecs/yabn-1.0.3.jar")
			implementation files("${rootDir}/../dev-server/mods/ResourcefulLib-5.0.3.jar")
			implementation files("${rootDir}/../conversion/vendored/resourcefullib-bytecodecs/bytecodecs-1.1.3.jar")
		}
	}
	if (project.name == 'chipped') {
		dependencies {
			modCompileClasspath "net.fabricmc.fabric.api:fabric-menu-api-v1:2.0.16+086d547a9e"
			modCompileClasspath "net.fabricmc.fabric.api:fabric-recipe-api-v1:9.0.20+11e1c9a39e"
			// workbench 3D preview PIP renderer (PictureInPictureRendererRegistry)
			modCompileClasspath "net.fabricmc.fabric.api:fabric-rendering-v1:25.3.2+515ac5339e"
		}
	}
	if (project.name == 'dungeonz') {
		dependencies {
			// gametests drive the real SkillXp/PartyManager classes; the
			// production compat layer stays reflection-only
			implementation project(':hearthwind-skills')
			modCompileClasspath "net.fabricmc.fabric-api:fabric-data-attachment-api-v1:2.2.18+515ac5339e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-object-builder-api-v1:24.1.0+6fcd5f039e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-resource-loader-v1:2.0.13+9edec1269e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.3+4575b05f9e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-rendering-v1:25.3.2+515ac5339e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-creative-tab-api-v1:5.0.14+d871b99e9e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-menu-api-v1:2.0.16+086d547a9e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-networking-api-v1:6.3.3+72073ef09e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-entity-events-v1:2.0.11+d871b99e9e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-screen-api-v1:5.2.1+5087f8249e"
			modCompileClasspath "net.fabricmc.fabric-api:fabric-command-api-v2:3.1.0+00cb03469e"
		}
	}

	afterEvaluate {
		if (name == 'hearthwind-client' || name == 'dungeonz' || name == 'chipped') {
			dependencies {
				// keymapping API is one of the modules the aggregator hides
				// at compile time; pin it for NutrientsKey (renamed from
				// key-binding in the 26.2 fabric-api generation).
				modCompileClasspath "net.fabricmc.fabric.api:fabric-key-mapping-api-v1:2.0.5+e2bdee789e"
				// client gametest API for the NutrientsScreen scenario
				// (version line pairs with fabric-api 0.158.0+26.2, see the
				// aggregator POM on maven.fabricmc.net).
				modCompileClasspath "net.fabricmc.fabric.api:fabric-client-gametest-api-v1:6.0.0+515ac5339e"
			}
		}
		if (name == 'hearthwind-survival' || name == 'hearthwind-skills' || name == 'hearthwind-jobs' || name == 'hearthwind-world' || name == 'dungeonz' || name.startsWith('letsdo-')) {
			dependencies {
				// fabric-api aggregator POM hides module classes at compile
				// time; pin gametest API for @GameTest compilation.
				// loom 1.17 has no modImplementation(); modCompileClasspath
				// gives compile + runtime presence.
				modCompileClasspath "net.fabricmc.fabric.api:fabric-gametest-api-v1:4.0.21+4a7fa0819e"
			}
		}
		if (name == 'hearthwind-primitive') {
			dependencies {
				modCompileClasspath "net.fabricmc.fabric.api:fabric-gametest-api-v1:4.0.21+4a7fa0819e"
				// leaves-stick loot hook uses the v3 loot API
				modCompileClasspath "net.fabricmc.fabric.api:fabric-loot-api-v3:3.0.17+06488ac19e"
			}
		}
		if (name == 'smallships') {
			dependencies {
				modCompileClasspath "net.fabricmc.fabric.api:fabric-key-mapping-api-v1:2.0.5+e2bdee789e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-menu-api-v1:2.0.16+086d547a9e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-creative-tab-api-v1:5.0.14+d871b99e9e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-particles-v1:5.0.18+d1756aa99e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-networking-api-v1:6.3.3+72073ef09e"
			modCompileClasspath "net.fabricmc.fabric.api:fabric-rendering-v1:25.3.2+515ac5339e"
			modCompileClasspath "net.fabricmc.fabric.api:fabric-networking-api-v1:6.3.3+72073ef09e"
				// gametests (SmallshipsGameTests)
				modCompileClasspath "net.fabricmc.fabric.api:fabric-gametest-api-v1:4.0.21+4a7fa0819e"
			}
		}

		if (name.startsWith('letsdo-')) {
			// Duplicate of the pre-afterEvaluate letsdo block retained for
			// documentation only. Loom resolves the mod compile classpath
			// before afterEvaluate, so adding a second copy here would just
			// double the deps; do NOT re-add dependencies here.
		}
	}

	processResources {
		def modVersion = version
		inputs.property 'version', modVersion
		filesMatching('fabric.mod.json') {
			expand 'version': modVersion
		}
	}
}
