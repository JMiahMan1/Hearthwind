plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	version = "${project.minecraft_version}+0.1.0"
	group = project.maven_group
	base { archivesName = project.name }

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	// hearthwind-client needs survival's ThirstSyncPayload at compile and
	// runtime. Must be declared BEFORE loom resolves runtime classpath, so do
	// it here, not in afterEvaluate (which is too late for implementation).
	if (project.name == 'hearthwind-client') {
		dependencies {
			implementation project(':hearthwind-survival')
			implementation project(':hearthwind-world')
		}
	}
	if (project.name == 'hearthwind-primitive') {
		dependencies {
			implementation project(':hearthwind-survival')
			implementation project(':hearthwind-world')
		}
	}
	if (project.name == 'hearthwind-skills') {
		dependencies {
			implementation project(':hearthwind-survival')
		}
	}
	if (project.name == 'hearthwind-jobs') {
		dependencies {
			implementation project(':hearthwind-survival')
		}
	}
	if (project.name == 'hearthwind-survival') {
		dependencies {
			implementation project(':hearthwind-world')
		}
	}

	afterEvaluate {
		if (name == 'hearthwind-client') {
			dependencies {
				// keymapping API is one of the modules the aggregator hides
				// at compile time; pin it for NutrientsKey (renamed from
				// key-binding in the 26.2 fabric-api generation).
				modCompileClasspath "net.fabricmc.fabric.api:fabric-key-mapping-api-v1:2.0.5+e2bdee789e"
			}
		}
		if (name == 'hearthwind-survival' || name == 'hearthwind-skills' || name == 'hearthwind-jobs' || name == 'hearthwind-world') {
			dependencies {
				// fabric-api aggregator POM hides module classes at compile
				// time; pin gametest API for @GameTest compilation.
				// loom 1.17 has no modImplementation(); modCompileClasspath
				// gives compile + runtime presence.
				modCompileClasspath "net.fabricmc.fabric.api:fabric-gametest-api-v1:4.0.21+4a7fa0819e"
			}
		}
		if (name == 'hearthwind-primitive') {
			dependencies {
				modCompileClasspath "net.fabricmc.fabric.api:fabric-gametest-api-v1:4.0.21+4a7fa0819e"
				// leaves-stick loot hook uses the v3 loot API
				modCompileClasspath "net.fabricmc.fabric.api:fabric-loot-api-v3:3.0.17+06488ac19e"
			}
		}
	}

	processResources {
		def modVersion = version
		inputs.property 'version', modVersion
		filesMatching('fabric.mod.json') {
			expand 'version': modVersion
		}
	}
}
