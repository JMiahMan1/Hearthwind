plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	version = "${project.minecraft_version}+0.1.0"
	group = project.maven_group
	repositories {
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.shedaniel.me/' }
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		implementation files("${rootDir}/../dev-server/mods/architectury-fabric-21.0.7.jar")
		implementation files("${rootDir}/../dev-server/mods/cloth-config-26.2.155.jar")
		implementation files("${rootDir}/../dev-server/mods/modmenu-20.0.1.jar")
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	// hearthwind-client needs survival's ThirstSyncPayload at compile and
	// runtime. Must be declared BEFORE loom resolves runtime classpath, so do
	// it here, not in afterEvaluate (which is too late for implementation).
	if (project.name == 'hearthwind-client') {
		dependencies {
			implementation project(':hearthwind-survival')
			implementation project(':hearthwind-world')
			// gametest scenarios read SkillXp/JobState attachments and
			// JobDefs level tables from the gametest thread
			implementation project(':hearthwind-skills')
			implementation project(':hearthwind-jobs')
		}
	}
	if (project.name == 'hearthwind-primitive') {
		dependencies {
			implementation project(':hearthwind-survival')
			implementation project(':hearthwind-world')
		}
	}
	if (project.name == 'hearthwind-skills') {
		dependencies {
			implementation project(':hearthwind-survival')
		}
	}
	if (project.name == 'hearthwind-jobs') {
		dependencies {
			implementation project(':hearthwind-survival')
			implementation project(':hearthwind-skills')
		}
	}
	if (project.name == 'hearthwind-survival') {
		dependencies {
			implementation project(':hearthwind-world')
		}
	}
	if (project.name.startsWith('letsdo-') && project.name != 'letsdo-farm-and-charm') {
		dependencies {
			implementation project(':letsdo-farm-and-charm')
		}
	}
	if (project.name == 'letsdo-candlelight' || project.name == 'letsdo-brewery') {
		dependencies {
			implementation project(':letsdo-vinery')
		}
	}

	afterEvaluate {
		if (name == 'hearthwind-client') {
			dependencies {
				// keymapping API is one of the modules the aggregator hides
				// at compile time; pin it for NutrientsKey (renamed from
				// key-binding in the 26.2 fabric-api generation).
				modCompileClasspath "net.fabricmc.fabric.api:fabric-key-mapping-api-v1:2.0.5+e2bdee789e"
				// client gametest API for the NutrientsScreen scenario
				// (version line pairs with fabric-api 0.158.0+26.2, see the
				// aggregator POM on maven.fabricmc.net).
				modCompileClasspath "net.fabricmc.fabric.api:fabric-client-gametest-api-v1:6.0.0+515ac5339e"
			}
		}
		if (name == 'hearthwind-survival' || name == 'hearthwind-skills' || name == 'hearthwind-jobs' || name == 'hearthwind-world') {
			dependencies {
				// fabric-api aggregator POM hides module classes at compile
				// time; pin gametest API for @GameTest compilation.
				// loom 1.17 has no modImplementation(); modCompileClasspath
				// gives compile + runtime presence.
				modCompileClasspath "net.fabricmc.fabric.api:fabric-gametest-api-v1:4.0.21+4a7fa0819e"
			}
		}
		if (name == 'hearthwind-primitive') {
			dependencies {
				modCompileClasspath "net.fabricmc.fabric.api:fabric-gametest-api-v1:4.0.21+4a7fa0819e"
				// leaves-stick loot hook uses the v3 loot API
				modCompileClasspath "net.fabricmc.fabric.api:fabric-loot-api-v3:3.0.17+06488ac19e"
			}
		}
		if (name == 'smallships') {
			dependencies {
				modCompileClasspath "net.fabricmc.fabric.api:fabric-key-mapping-api-v1:2.0.5+e2bdee789e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-menu-api-v1:2.0.16+086d547a9e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-creative-tab-api-v1:5.0.14+d871b99e9e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-particles-v1:5.0.18+d1756aa99e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-networking-api-v1:6.3.3+72073ef09e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-rendering-v1:25.3.2+515ac5339e"
				// gametests (SmallshipsGameTests)
				modCompileClasspath "net.fabricmc.fabric.api:fabric-gametest-api-v1:4.0.21+4a7fa0819e"
			}
		}
		if (name.startsWith('letsdo-')) {
			dependencies {
				modCompileClasspath "dev.architectury:architectury:21.0.7"
				modCompileClasspath "dev.architectury:architectury-fabric:21.0.7"
				modCompileClasspath "me.shedaniel.cloth:cloth-config-fabric:19.0.147"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-object-builder-api-v1:24.1.0+6fcd5f039e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-resource-loader-v1:2.0.13+9edec1269e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-lifecycle-events-v1:4.1.3+4575b05f9e"
				modCompileClasspath "net.fabricmc.fabric.api:fabric-rendering-v1:25.3.2+515ac5339e"
				modCompileClasspath files("${rootDir}/../dev-server/mods/modmenu-20.0.1.jar")
			}
		}
	}

	processResources {
		def modVersion = version
		inputs.property 'version', modVersion
		filesMatching('fabric.mod.json') {
			expand 'version': modVersion
		}
	}
}
