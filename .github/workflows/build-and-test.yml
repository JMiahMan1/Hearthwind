name: build-and-test

on:
  push:
    branches: [server-26.2, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-gametest:
    # GH ubuntu runners (2 vCPU, 7 GB) are roomier than the low-memory
    # build host; keep --no-daemon anyway for deterministic CI runs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build all modules
        working-directory: custom-mods
        run: ./gradlew build --no-daemon --max-workers=2

      - name: Headless gametests
        working-directory: custom-mods
        run: bash tools/run_gametests.sh --keep-server

      - name: Always upload gametest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            custom-mods/.gametest-server/gametest-report.xml
            custom-mods/.gametest-server/gametest.log

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: custom-mods/*/build/libs/*+*.jar
          retention-days: 14

  # Boot smoke test of a full pack server (mods + migrated datapack).
  # Requires conversion artifacts; enable when resolve_deps is wired to CI.
  boot-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve deps + materialize server dir
        run: |
          python3 conversion/scripts/resolve_deps.py
          python3 conversion/scripts/build_pack.py --server-dir
      - name: Static feature-order cycle check
        run: |
          python3 custom-mods/tools/check_feature_cycles.py \
            --mods-dir conversion/build/dist/server/mods \
            --datapack conversion/datapacks/hearthwind \
            --baseline custom-mods/tools/feature_cycle_baseline.txt \
            --strict
      - name: Boot server, expect Done, smoke fresh worldgen
        run: |
          cd dist/server || cd conversion/dist/server
          rm -rf world
          echo "eula=true" > eula.txt
          printf "\nenable-rcon=true\nrcon.port=25575\nrcon.password=agedtest\npause-when-empty-seconds=-1\n" >> server.properties
          (timeout 240 java -Xmx3G -jar fabric-server.jar nogui > boot.log 2>&1 &)
          RCON="$(git rev-parse --show-toplevel)/custom-mods/tools/rcon.py"
          for i in $(seq 1 40); do
            sleep 6
            if grep -q "Done (" boot.log; then
              for chunk in "1000 1000" "-1000 -1000"; do
                for r in 1 2 3; do
                  python3 "$RCON" 127.0.0.1 25575 agedtest "forceload add $chunk" && break
                  sleep 3
                done
              done
              sleep 10
              if grep -q "Feature order cycle" boot.log; then
                echo "FAIL: feature order cycle during fresh worldgen"; tail -50 boot.log; exit 1
              fi
              if grep -q "Error upgrading chunk" boot.log; then
                echo "FAIL: chunk feature upgrade error"; tail -50 boot.log; exit 1
              fi
              echo "boot-smoke OK: Done + fresh-chunk forceload clean"
              exit 0
            fi
          done
          tail -50 boot.log; exit 1
